<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Discord Exporter</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1f22;
      color: #dbdee1;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #5865f2;
      color: #fff;
      padding: 2px 5px;
      border-radius: 4px;
      margin-left: auto;
    }
    .desc {
      font-size: 12px;
      color: #949ba4;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #2b2d31;
      border: 1px solid #383a40;
      color: #f2f3f5;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #5865f2;
      border-color: #5865f2;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #23a55a;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h3>
    ⚡ Discord Exporter
    <span class="badge">v1.0</span>
  </h3>
  <div class="desc">
    Export chat messages with authors, permalinks, replies, and attachments for LLM Bug Audits.
  </div>
  <div class="actions">
    <button id="pop-copy-toon">📋 Copy TOON (LLM Optimized)</button>
    <button id="pop-copy-json">📦 Copy JSON</button>
    <button id="pop-copy-md">📝 Copy Markdown</button>
  </div>
  <div class="status" id="pop-status"></div>

  <script src="popup.js"></script>
</body>
</html>
